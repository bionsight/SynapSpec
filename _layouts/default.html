<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  {% assign css_cache_buster = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ css_cache_buster }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">

  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

  {% seo %}
  {% include mixpanel.html %}
</head>
<body class="{% if page.title == 'Home' %}page-home{% endif %}">
  {% include header.html %}

  <main class="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  {% include cookie-consent.html %}
</body>
</html>
