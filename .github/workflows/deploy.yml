name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 중 새 push가 와도 겹쳐 실행하지 않는다 — 이전 배포를 취소하지도 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # outDir이 기본값(dist)이라 withastro/action의 하드코딩된 "<path>/dist/"와
      # 그대로 맞는다 — bion-design과 달리 이 저장소는 dist/를 다른 용도로 쓰지 않는다.
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
